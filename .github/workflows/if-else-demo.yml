name: If-else demo
on: 
  push:
     branches:
       - main
       - develop

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name : Run if branch is main
        if: github.ref == 'refs/heads/main'
        run: echo "Running for main branch"
      - name: run this step
        run: echo "running this step"
