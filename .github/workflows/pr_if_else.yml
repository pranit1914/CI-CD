name: pull_request if else
on: 
  push: 
    branches:
      - main
  pull_request:
    types: 
      - opened
      - synchronize

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Build Step
        run: echo "Building an application ......"

  deploy:
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && github.ref_name == 'main'
      steps:
        - name: Deploy Step
          run: echo "Deploying the app ....waiting"
  
      
